name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test (race detector)
        run: go test -race ./...

  # Installed with go install rather than through golangci-lint-action. The
  # action failed here with "exit code 3" before ever linting a line, and its
  # logs are not readable without signing in, which makes it the wrong thing to
  # depend on: the two commands below can be run locally and give the same
  # answer. The linter set in backend/.golangci.yml is deliberately small and
  # its findings are cleared, so this is a real gate — a red lint job means
  # this change broke something, not that the repo has a backlog.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - name: Lint
        run: golangci-lint run ./...
