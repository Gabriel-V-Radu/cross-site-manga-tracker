<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cross-Site Tracker — Link Review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=IBM+Plex+Sans+Condensed:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="stylesheet" href="{{assetURL "dashboard.css"}}">
    <script src="{{assetURL "htmx.min.js"}}" defer></script>
</head>

<body>
    <div class="grain"></div>
    <main class="shell">
        <header class="masthead">
            <div class="masthead__copy">
                <p class="kicker">Cross-Site Tracker</p>
                <h1>Link Review</h1>
                <p class="subtitle">Scan a source for series it can serve as a fallback, then settle the matches here: accept, reject, or paste the right URL yourself.</p>
            </div>
            <div class="profile-toolbar">
                <label class="profile-toolbar__label profile-toolbar__label--profile">
                    Active Profile
                    <input type="text" value="{{.ActiveProfile.Name}}" readonly>
                </label>
                <a class="action-btn" href="/dashboard">Back to dashboard</a>
            </div>
        </header>

        <form id="links-scope" class="control-panel links-controls"
              hx-get="/dashboard/links/queue"
              hx-target="#links-queue"
              hx-swap="innerHTML"
              hx-trigger="change">
            <label class="links-controls__field">
                Source to link
                <select id="links-source-select" name="source">
                    {{$selected := .SelectedSourceID}}
                    {{range .Sources}}
                    <option value="{{.ID}}" {{if eq .ID $selected}}selected{{end}}>{{.Name}}</option>
                    {{end}}
                </select>
            </label>
            <label class="links-controls__field">
                Status
                <select name="status">
                    {{$status := .SelectedStatus}}
                    <option value="all" {{if eq $status "all"}}selected{{end}}>All statuses</option>
                    <option value="reading+plan" {{if eq $status "reading+plan"}}selected{{end}}>Reading + Plan to read</option>
                    <option value="reading" {{if eq $status "reading"}}selected{{end}}>Reading only</option>
                    <option value="plan_to_read" {{if eq $status "plan_to_read"}}selected{{end}}>Plan to read only</option>
                    <option value="on_hold" {{if eq $status "on_hold"}}selected{{end}}>On hold</option>
                    <option value="completed" {{if eq $status "completed"}}selected{{end}}>Completed</option>
                    <option value="dropped" {{if eq $status "dropped"}}selected{{end}}>Dropped</option>
                </select>
            </label>
            <label class="links-controls__field">
                Primary source
                <select name="primary">
                    {{$primary := .SelectedPrimary}}
                    <option value="any" {{if eq $primary "any"}}selected{{end}}>Any</option>
                    <option value="broken" {{if eq $primary "broken"}}selected{{end}}>Broken right now</option>
                    {{range .Sources}}
                    <option value="{{.ID}}" {{if eq (printf "%d" .ID) $primary}}selected{{end}}>{{.Name}}</option>
                    {{end}}
                </select>
            </label>
            <label class="links-controls__field">
                Linked alternates
                <select name="alternates">
                    {{$alternates := .SelectedAlternates}}
                    <option value="any" {{if eq $alternates "any"}}selected{{end}}>Any number</option>
                    <option value="0" {{if eq $alternates "0"}}selected{{end}}>None yet</option>
                    <option value="1" {{if eq $alternates "1"}}selected{{end}}>At most one</option>
                </select>
            </label>
            <label class="links-controls__field">
                View
                <select name="show">
                    <option value="all">Everything</option>
                    <option value="with">Only with candidates</option>
                    <option value="without">Only without candidates</option>
                </select>
            </label>
            <button type="button"
                    class="action-btn action-btn--accent"
                    hx-post="/dashboard/links/scan"
                    hx-include="#links-scope"
                    hx-target="#link-scan-status"
                    hx-swap="outerHTML">
                Scan for candidates
            </button>
            <!-- hx-target="this" is load-bearing: the div sits inside the scope
                 form, whose hx-target="#links-queue" would otherwise be
                 inherited — swapping the status INTO the results section. -->
            <div id="link-scan-status" class="link-scan-status"
                 hx-get="/dashboard/links/scan-status"
                 hx-trigger="load"
                 hx-target="this"
                 hx-swap="outerHTML"></div>
        </form>

        <section id="links-queue" class="links-queue"
                 hx-get="/dashboard/links/queue"
                 hx-trigger="load"
                 hx-include="#links-scope"
                 hx-swap="innerHTML"></section>
    </main>
</body>

</html>
