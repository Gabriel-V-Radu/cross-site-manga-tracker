services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cross-site-tracker-api
    env_file:
      - ./backend/.env.example
    environment:
      - SQLITE_PATH=/app/data/app.sqlite
      # A label and nothing else: the server reads APP_ENV for the "env" field
      # of its "api started" log line and for no decision. The env file above
      # is the development example, so without this the deployed container
      # introduced itself as env=development in the log kept on the Pi.
      - APP_ENV=production
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    # The healthcheck only labels the container (healthy/unhealthy in
    # `docker compose ps`): plain Engine and compose never restart on it, and
    # restart only fires when the process exits. A process that is listening
    # but wedged (the single SQLite connection stuck behind a lost
    # transaction) is restarted by the server's own database watchdog
    # (backend/cmd/api/main.go), which shuts down with a non-zero exit after
    # five failed pings a minute apart. deploy.ps1 polls /health itself.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
