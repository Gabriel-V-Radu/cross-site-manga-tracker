services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cross-site-tracker-api
    env_file:
      - ./backend/.env.example
    environment:
      - SQLITE_PATH=/app/data/app.sqlite
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    # The healthcheck only labels the container (healthy/unhealthy in
    # `docker compose ps`): plain Engine and compose never restart on it, and
    # restart only fires when the process exits. A process that is listening
    # but wedged (the single SQLite connection stuck behind a lost
    # transaction) is restarted by the server's own database watchdog
    # (backend/cmd/api/main.go), which shuts down with a non-zero exit after
    # five failed pings a minute apart. deploy.ps1 polls /health itself.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
