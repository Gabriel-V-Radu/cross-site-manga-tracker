services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cross-site-tracker-api
    env_file:
      - ./backend/.env.example
    environment:
      - SQLITE_PATH=/app/data/app.sqlite
      - MIGRATIONS_PATH=/app/migrations
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    # restart only fires on exit. A process that is listening but wedged (the
    # single SQLite connection stuck behind a lost transaction) stays down for
    # good without this; /health is what deploy.ps1 already polls.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
